name: Build Droid MCP APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check repository
        run: |
          pwd
          echo "=== FILES ==="
          ls -la
          echo "=== GRADLEW ==="
          find . -maxdepth 3 -name gradlew -type f -print

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          GRADLEW=$(find . -maxdepth 3 -name gradlew -type f | head -n 1)
          echo "Using Gradle wrapper: $GRADLEW"
          chmod +x "$GRADLEW"
          "$GRADLEW" assembleDebug --no-daemon

      - name: Find APK
        run: |
          echo "=== APK FILES ==="
          find . -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: droid-mcp-apk
          path: "**/build/outputs/apk/**/*.apk"
          if-no-files-found: error