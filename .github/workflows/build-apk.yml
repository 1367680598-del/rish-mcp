name: Build Droid MCP APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check Gradle wrapper
        run: |
          ls -la
          ls -la ./gradlew
          chmod +x ./gradlew

      - name: Build Sample App APK
        run: |
          bash ./gradlew :sample-app:assembleDebug --no-daemon

      - name: Find APK
        run: |
          echo "Searching for APK..."
          find . -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: droid-mcp-sample-app
          path: |
            sample-app/build/outputs/apk/debug/*.apk
          if-no-files-found: error